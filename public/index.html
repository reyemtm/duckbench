<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DuckDB vs SQLite Analytics Performance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            border: 'hsl(214.3 31.8% 91.4%)',
            input: 'hsl(214.3 31.8% 91.4%)',
            ring: 'hsl(222.2 84% 4.9%)',
            background: 'hsl(0 0% 100%)',
            foreground: 'hsl(222.2 84% 4.9%)',
            primary: {
              DEFAULT: 'hsl(222.2 47.4% 11.2%)',
              foreground: 'hsl(210 40% 98%)',
            },
            secondary: {
              DEFAULT: 'hsl(210 40% 96.1%)',
              foreground: 'hsl(222.2 47.4% 11.2%)',
            },
            muted: {
              DEFAULT: 'hsl(210 40% 96.1%)',
              foreground: 'hsl(215.4 16.3% 46.9%)',
            },
            accent: {
              DEFAULT: 'hsl(210 40% 96.1%)',
              foreground: 'hsl(222.2 47.4% 11.2%)',
            },
            destructive: {
              DEFAULT: 'hsl(0 84.2% 60.2%)',
              foreground: 'hsl(210 40% 98%)',
            },
          },
          borderRadius: {
            lg: '0.5rem',
            md: 'calc(0.5rem - 2px)',
            sm: 'calc(0.5rem - 4px)',
          },
        }
      }
    }
  </script>
  <style>
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .animate-spin {
      animation: spin 1s linear infinite;
    }
  </style>
</head>

<body class="bg-background antialiased">
  <div class="container mx-auto px-4 py-8 max-w-7xl">
    <!-- Header -->
    <div class="mb-10">
      <h1 class="scroll-m-20 text-4xl font-extrabold tracking-tight lg:text-5xl text-foreground mb-2">
        DuckDB vs SQLite Analytics
      </h1>
      <p class="text-lg text-muted-foreground">
        Performance comparison with 10 million order records
      </p>
    </div>

    <!-- Stats Grid -->
    <div class="grid gap-4 md:grid-cols-3 mb-8" id="stats">
      <div class="rounded-lg border bg-card text-card-foreground shadow-sm">
        <div class="p-6 flex flex-row items-center justify-between space-y-0 pb-2">
          <div class="tracking-tight text-sm font-medium text-muted-foreground">Total Orders</div>
          <svg class="h-4 w-4 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
          </svg>
        </div>
        <div class="p-6 pt-0">
          <div class="text-2xl font-bold stat-value">-</div>
        </div>
      </div>

      <div class="rounded-lg border bg-card text-card-foreground shadow-sm">
        <div class="p-6 flex flex-row items-center justify-between space-y-0 pb-2">
          <div class="tracking-tight text-sm font-medium text-muted-foreground">Total Customers</div>
          <svg class="h-4 w-4 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
        </div>
        <div class="p-6 pt-0">
          <div class="text-2xl font-bold stat-value">-</div>
        </div>
      </div>

      <div class="rounded-lg border bg-card text-card-foreground shadow-sm">
        <div class="p-6 flex flex-row items-center justify-between space-y-0 pb-2">
          <div class="tracking-tight text-sm font-medium text-muted-foreground">Total Products</div>
          <svg class="h-4 w-4 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
          </svg>
        </div>
        <div class="p-6 pt-0">
          <div class="text-2xl font-bold stat-value">-</div>
        </div>
      </div>
    </div>

    <!-- Query Type Tabs -->
    <div class="mb-6">
      <div class="inline-flex h-10 items-center justify-center rounded-md bg-muted p-1 text-muted-foreground">
        <button onclick="switchQueryType('analytics')" id="analyticsTab"
          class="inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1.5 text-sm font-medium ring-offset-background transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-background text-foreground shadow-sm">
          📊 Analytics Queries
        </button>
        <button onclick="switchQueryType('fts')" id="ftsTab"
          class="inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1.5 text-sm font-medium ring-offset-background transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50">
          🔍 Search Queries
        </button>
      </div>
      <p class="text-sm text-muted-foreground mt-2" id="queryTypeDesc">
        Complex analytical queries with aggregations and joins
      </p>
    </div>

    <!-- Control Buttons -->
    <div class="flex flex-wrap gap-3 mb-8">
      <button onclick="runBenchmark('sqlite')" id="sqliteBtn"
        class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-10 px-4 py-2">
        <svg class="mr-2 h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z" />
        </svg>
        Run SQLite
      </button>

      <button onclick="runBenchmark('json')" id="jsonBtn"
        class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-10 px-4 py-2">
        <span class="mr-2">📊</span>
        Run In-Memory JSON
      </button>

      <button onclick="runBenchmark('duckdb')" id="duckdbBtn"
        class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-10 px-4 py-2">
        <span class="mr-2">🦆</span>
        Run DuckDB
      </button>

      <button onclick="runAll()" id="allBtn"
        class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2">
        <svg class="mr-2 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        Run All & Compare
      </button>
    </div>

    <!-- Loading Spinner -->
    <div id="loading" class="hidden text-center py-12">
      <div class="inline-block w-12 h-12 border-4 border-muted border-t-primary rounded-full animate-spin"></div>
      <p class="text-muted-foreground text-sm mt-4">Running benchmarks...</p>
    </div>

    <!-- Results Container -->
    <div id="results"></div>

    <!-- Comparison Container -->
    <div id="comparison"></div>

    <!-- Data Verification Section -->
    <div id="dataVerification" class="hidden">
      <div class="rounded-lg border bg-card text-card-foreground shadow-sm mb-8">
        <div class="flex flex-col space-y-1.5 p-6 border-b">
          <div class="flex items-center gap-3">
            <svg class="w-6 h-6 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
            </svg>
            <h2 class="text-2xl font-semibold leading-none tracking-tight">Data Verification</h2>
          </div>
          <p class="text-sm text-muted-foreground">Comparing actual query results to ensure correctness</p>
        </div>

        <div id="dataVerificationContent" class="p-6">
          <!-- Will be populated with tabs for each query -->
        </div>
      </div>
    </div>
  </div>

  <script>
    let comparisonChart = null;
    let currentQueryType = 'analytics'; // 'analytics' or 'fts'

    // Load stats on page load
    fetch('/api/stats')
      .then(r => r.json())
      .then(data => {
        const stats = data.sqlite;
        document.querySelectorAll('.stat-value')[0].textContent = stats.orders.toLocaleString();
        document.querySelectorAll('.stat-value')[1].textContent = stats.customers.toLocaleString();
        document.querySelectorAll('.stat-value')[2].textContent = stats.products.toLocaleString();
      });

    function switchQueryType(type) {
      currentQueryType = type;

      // Update tab styling
      const analyticsTab = document.getElementById('analyticsTab');
      const ftsTab = document.getElementById('ftsTab');
      const desc = document.getElementById('queryTypeDesc');
      const jsonBtn = document.getElementById('jsonBtn');
      const allBtn = document.getElementById('allBtn');

      if (type === 'analytics') {
        analyticsTab.classList.add('bg-background', 'text-foreground', 'shadow-sm');
        analyticsTab.classList.remove('text-muted-foreground');
        ftsTab.classList.remove('bg-background', 'text-foreground', 'shadow-sm');
        ftsTab.classList.add('text-muted-foreground');
        desc.textContent = 'Complex analytical queries with aggregations and joins';
        jsonBtn.style.display = 'inline-flex';
        allBtn.textContent = '⚡ Run All & Compare';
      } else {
        ftsTab.classList.add('bg-background', 'text-foreground', 'shadow-sm');
        ftsTab.classList.remove('text-muted-foreground');
        analyticsTab.classList.remove('bg-background', 'text-foreground', 'shadow-sm');
        analyticsTab.classList.add('text-muted-foreground');
        desc.textContent = 'Full-text search queries using LIKE/ILIKE patterns';
        jsonBtn.style.display = 'none';
        allBtn.textContent = '⚡ Run Both & Compare';
      }

      // Clear results when switching
      document.getElementById('results').innerHTML = '';
      document.getElementById('comparison').innerHTML = '';
    }

    function formatTime(ms) {
      if (ms < 1) return `${ms.toFixed(3)} ms`;
      if (ms < 1000) return `${ms.toFixed(2)} ms`;
      return `${(ms / 1000).toFixed(2)} s`;
    }

    async function runBenchmark(db) {
      const buttons = document.querySelectorAll('button');
      buttons.forEach(btn => btn.disabled = true);
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('results').innerHTML = '';
      document.getElementById('comparison').innerHTML = '';

      try {
        const response = await fetch(`/api/benchmark?db=${db}&type=${currentQueryType}`);
        const data = await response.json();

        if (!data.success) {
          throw new Error(data.error);
        }

        displayResults(data, db);
      } catch (error) {
        document.getElementById('results').innerHTML =
          `<div class="rounded-lg border border-destructive bg-destructive/10 p-4 text-sm text-destructive">
            <strong class="font-medium">Error:</strong> ${error.message}
          </div>`;
      } finally {
        document.getElementById('loading').classList.add('hidden');
        buttons.forEach(btn => btn.disabled = false);
      }
    }

    function displayResults(data, db) {
      const totalTime = data.wallMs || data.results.reduce((sum, r) => sum + r.timeMs, 0);
      const dbName = db === 'sqlite' ? 'SQLite' : db === 'duckdb' ? 'DuckDB' : 'In-Memory JSON';
      const icon = db === 'sqlite' ? '🛡️' : db === 'duckdb' ? '🦆' : '📊';

      const html = `
        <div class="rounded-lg border bg-card text-card-foreground shadow-sm mb-8">
          <div class="flex flex-col space-y-1.5 p-6 border-b">
            <div class="flex items-center gap-3">
              <span class="text-3xl">${icon}</span>
              <h2 class="text-2xl font-semibold leading-none tracking-tight">${dbName} Results</h2>
            </div>
          </div>

          <div class="p-6">
            <div class="rounded-lg border bg-muted/50 p-6 mb-6">
              <p class="text-sm font-medium text-muted-foreground mb-1">Execution Time</p>
              <p class="text-3xl font-bold">${formatTime(totalTime)}</p>
            </div>

            <div class="space-y-3">
              ${data.results.map((result, i) => `
                <div class="rounded-lg border bg-card p-4 hover:bg-accent/50 transition-colors">
                  <div class="flex justify-between items-start mb-2">
                    <div class="flex-1">
                      <h3 class="font-semibold leading-none tracking-tight">${result.name}</h3>
                      ${result.searchTerm ? `<p class="text-xs text-muted-foreground mt-1">Search: "${result.searchTerm}"</p>` : ''}
                    </div>
                    <span class="text-xl font-bold">${formatTime(result.timeMs)}</span>
                  </div>
                  <p class="text-sm text-muted-foreground flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                    </svg>
                    ${result.rowCount.toLocaleString()} rows
                  </p>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;

      document.getElementById('results').innerHTML = html;

      // Show data verification with actual results
      displayDataVerification(data.results, db);
    }

    function displayDataVerification(results, db) {
      const verificationSection = document.getElementById('dataVerification');
      const verificationContent = document.getElementById('dataVerificationContent');

      // Ensure we have an array
      if (!Array.isArray(results) || results.length === 0) {
        verificationSection.classList.add('hidden');
        return;
      }

      verificationSection.classList.remove('hidden');

      const tabsHtml = results.map((result, index) => `
        <div class="mb-6 last:mb-0">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-lg font-semibold">${result.name}</h3>
            <span class="text-sm text-muted-foreground">${result.rowCount} rows returned</span>
          </div>

          ${result.data && result.data.length > 0 ? `
            <div class="overflow-x-auto rounded-lg border">
              <table class="w-full text-sm">
                <thead class="bg-muted/50 border-b">
                  <tr>
                    ${Object.keys(result.data[0]).map((key, idx) => {
        const firstValue = result.data[0][key];
        const isNumber = typeof firstValue === 'number';
        return `<th class="${isNumber ? 'text-right' : 'text-left'} p-3 font-medium text-muted-foreground">${key.substring(0, 10)}</th>`;
      }).join('')}
                  </tr>
                </thead>
                <tbody>
                  ${result.data.map((row, rowIndex) => `
                    <tr class="${rowIndex % 2 === 0 ? 'bg-background' : 'bg-muted/20'}">
                      ${Object.entries(row).map(([key, value]) => {
        const isNumber = typeof value === 'number';
        return `<td class="${isNumber ? 'text-right' : 'text-left'} p-3">${formatCellValue(value)}</td>`;
      }).join('')}
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>

            ${createDataChart(result, index)}
          ` : '<p class="text-sm text-muted-foreground">No data to display</p>'}
        </div>
      `).join('');

      verificationContent.innerHTML = tabsHtml;

      // Render charts after DOM update
      setTimeout(() => {
        results.forEach((result, index) => {
          if (result.data && result.data.length > 0) {
            renderDataChart(result, index);
          }
        });
      }, 100);
    }

    function formatCellValue(value) {
      if (value === null || value === undefined) return '<span class="text-muted-foreground">null</span>';
      if (typeof value === 'number') {
        if (Number.isInteger(value)) return value.toLocaleString();
        // Use toLocaleString with maximumFractionDigits for large numbers, toFixed for small decimals
        if (value > 1000) return value.toLocaleString('en-US', { maximumFractionDigits: 0, minimumFractionDigits: 0 });
        return value.toFixed(2);
      }
      return String(value);
    }

    function createDataChart(result, index) {
      // Only create charts for data with numeric values
      const firstRow = result.data[0];
      const numericColumns = Object.entries(firstRow)
        .filter(([key, value]) => typeof value === 'number' && key !== 'order_id' && key !== 'customer_id' && key !== 'product_id')
        .map(([key]) => key);

      if (numericColumns.length === 0 || result.data.length > 20) return '';

      return `
        <div class="mt-4 p-4 rounded-lg border bg-muted/20">
          <canvas id="dataChart${index}" style="max-height: 300px;"></canvas>
        </div>
      `;
    }

    function renderDataChart(result, index) {
      const canvas = document.getElementById(`dataChart${index}`);
      if (!canvas) return;

      const ctx = canvas.getContext('2d');
      const firstRow = result.data[0];

      // Find label and numeric columns
      const labelColumn = Object.keys(firstRow).find(key =>
        typeof firstRow[key] === 'string' || key.includes('name') || key.includes('country') || key.includes('category')
      );

      const numericColumns = Object.entries(firstRow)
        .filter(([key, value]) => typeof value === 'number' && key !== 'order_id' && key !== 'customer_id' && key !== 'product_id')
        .map(([key]) => key);

      if (!labelColumn || numericColumns.length === 0) return;

      const labels = result.data.slice(0, 10).map(row => String(row[labelColumn]).substring(0, 20));

      const datasets = numericColumns.map((col, i) => ({
        label: col.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase()),
        data: result.data.slice(0, 10).map(row => row[col]),
        backgroundColor: `hsl(${220 + i * 30}, 70%, 50%)`,
        borderColor: `hsl(${220 + i * 30}, 70%, 40%)`,
        borderWidth: 1,
      }));

      new Chart(ctx, {
        type: result.data.length > 5 ? 'bar' : 'bar',
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            legend: { display: numericColumns.length > 1 },
            tooltip: {
              backgroundColor: 'hsl(222.2 47.4% 11.2%)',
              padding: 12,
              cornerRadius: 6,
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              grid: {
                color: 'hsl(214.3 31.8% 91.4%)',
                drawBorder: false
              },
              ticks: {
                font: { size: 11 },
                color: 'hsl(215.4 16.3% 46.9%)'
              },
              border: { display: false }
            },
            x: {
              grid: { display: false },
              ticks: {
                font: { size: 10 },
                color: 'hsl(215.4 16.3% 46.9%)',
                maxRotation: 45,
                minRotation: 45
              },
              border: { display: false }
            }
          }
        }
      });
    }

    async function runAll() {
      const buttons = document.querySelectorAll('button');
      buttons.forEach(btn => btn.disabled = true);
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('results').innerHTML = '';
      document.getElementById('comparison').innerHTML = '';

      try {
        const response = await fetch(`/api/compare?type=${currentQueryType}`);
        const data = await response.json();

        if (!data.success) {
          throw new Error(data.error);
        }

        if (currentQueryType === 'fts') {
          displayBothResults(data.sqlite, data.duckdb, data.speedup);
        } else {
          displayAllResults(data.sqlite, data.duckdb, data.json, data.fastest);
        }
      } catch (error) {
        document.getElementById('results').innerHTML =
          `<div class="rounded-lg border border-destructive bg-destructive/10 p-4 text-sm text-destructive">
            <strong class="font-medium">Error:</strong> ${error.message}
          </div>`;
      } finally {
        document.getElementById('loading').classList.add('hidden');
        buttons.forEach(btn => btn.disabled = false);
      }
    }

    function displayAllResults(sqliteData, duckdbData, jsonData, fastest) {
      // Validate data structure before using
      if (!sqliteData || !sqliteData.results || !Array.isArray(sqliteData.results)) {
        console.error('Invalid sqliteData:', sqliteData);
        document.getElementById('results').innerHTML =
          `<div class="rounded-lg border border-destructive bg-destructive/10 p-4 text-sm text-destructive">
            <strong class="font-medium">Error:</strong> Invalid SQLite results data
          </div>`;
        return;
      }
      if (!duckdbData || !duckdbData.results || !Array.isArray(duckdbData.results)) {
        console.error('Invalid duckdbData:', duckdbData);
        document.getElementById('results').innerHTML =
          `<div class="rounded-lg border border-destructive bg-destructive/10 p-4 text-sm text-destructive">
            <strong class="font-medium">Error:</strong> Invalid DuckDB results data
          </div>`;
        return;
      }
      if (!jsonData || !jsonData.results || !Array.isArray(jsonData.results)) {
        console.error('Invalid jsonData:', jsonData);
        document.getElementById('results').innerHTML =
          `<div class="rounded-lg border border-destructive bg-destructive/10 p-4 text-sm text-destructive">
            <strong class="font-medium">Error:</strong> Invalid JSON results data
          </div>`;
        return;
      }

      const sqliteTotal = sqliteData.total;
      const duckdbTotal = duckdbData.total;
      const jsonTotal = jsonData.total;

      // Determine fastest for each query
      const queryWinners = sqliteData.results.map((sqliteResult, index) => {
        const duckdbResult = duckdbData.results[index];
        const jsonResult = jsonData.results[index];
        const times = [
          { db: 'sqlite', time: sqliteResult.timeMs },
          { db: 'json', time: jsonResult.timeMs },
          { db: 'duckdb', time: duckdbResult.timeMs }
        ];
        const fastest = times.reduce((min, curr) => curr.time < min.time ? curr : min);
        return fastest.db;
      });

      // Display individual results side by side
      const resultsHtml = `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
          <!-- SQLite Results -->
          <div class="rounded-lg border bg-card text-card-foreground shadow-sm">
            <div class="flex flex-col space-y-1.5 p-6 border-b">

    function createThreeWayChart(sqliteResults, duckdbResults, jsonResults) {
      // Validate inputs are arrays
      if (!Array.isArray(sqliteResults) || !Array.isArray(duckdbResults) || !Array.isArray(jsonResults)) {
        console.error('createThreeWayChart received invalid data:', {
          sqliteResults: sqliteResults,
          duckdbResults: duckdbResults,
          jsonResults: jsonResults
        });
        return;
      }

      if (comparisonChart) {
        comparisonChart.destroy();
      }

      // Build comparison table rows
      const tableRows = sqliteResults.map((sqliteResult, index) => {
        const duckdbResult = duckdbResults[index];
        const jsonResult = jsonResults[index];

        const times = [
          { db: 'SQLite', time: sqliteResult.timeMs, name: 'SQLite' },
          { db: 'JSON', time: jsonResult.timeMs, name: 'JSON' },
          { db: 'DuckDB', time: duckdbResult.timeMs, name: 'DuckDB' }
        ];

        // Sort to find fastest and second fastest
        const sorted = [...times].sort((a, b) => a.time - b.time);
        const fastest = sorted[0];
        const secondFastest = sorted[1];
        const slowest = sorted[2];

        // Get background color class based on rank
        const getBgClass = (time) => {
          if (time === fastest.time) return 'bg-yellow-100';
          if (time === secondFastest.time) return 'bg-gray-100';
          return '';
        };

        // Format time with speedup inline (relative to slowest)
        const formatTimeWithSpeedup = (time, isSlowest) => {
          if (isSlowest) {
            return `${formatTime(time)} <span class="text-xs text-muted-foreground">(−)</span>`;
          }
          const speedup = ((slowest.time / time - 1) * 100).toFixed(0);
          return `${formatTime(time)} <span class="text-xs text-muted-foreground">(+${speedup}%)</span>`;
        };

        return `
          <tr class="border-b last:border-0 hover:bg-muted/50 transition-colors">
            <td class="p-3 text-sm font-medium">${sqliteResult.name}</td>
            <td class="p-3 text-sm text-right ${getBgClass(sqliteResult.timeMs)} ${sqliteResult.timeMs === slowest.time ? 'text-muted-foreground' : 'font-bold'}">${formatTimeWithSpeedup(sqliteResult.timeMs, sqliteResult.timeMs === slowest.time)}</td>
            <td class="p-3 text-sm text-right ${getBgClass(jsonResult.timeMs)} ${jsonResult.timeMs === slowest.time ? 'text-muted-foreground' : 'font-bold'}">${formatTimeWithSpeedup(jsonResult.timeMs, jsonResult.timeMs === slowest.time)}</td>
            <td class="p-3 text-sm text-right ${getBgClass(duckdbResult.timeMs)} ${duckdbResult.timeMs === slowest.time ? 'text-muted-foreground' : 'font-bold'}">${formatTimeWithSpeedup(duckdbResult.timeMs, duckdbResult.timeMs === slowest.time)}</td>
          </tr>
        `;
      }).join('');

      const comparisonHtml = `
        <!-- Performance Comparison Table -->
        <div class="rounded-lg border bg-card text-card-foreground shadow-sm mb-8">
          <div class="flex flex-col space-y-1.5 p-6 border-b">
            <div class="flex items-center gap-3">
              <svg class="w-6 h-6 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
              </svg>
              <h2 class="text-2xl font-semibold leading-none tracking-tight">Performance Comparison Table</h2>
            </div>
            <p class="text-sm text-muted-foreground">Execution times with relative performance shown as percentage faster than slowest</p>
          </div>
          <div class="p-6">
            <div class="overflow-x-auto rounded-lg border">
              <table class="w-full text-sm">
                <thead class="bg-muted/50 border-b">
                  <tr>
                    <th class="text-left p-3 font-medium">Query</th>
                    <th class="text-right p-3 font-medium">🛡️ SQLite</th>
                    <th class="text-right p-3 font-medium">📊 JSON</th>
                    <th class="text-right p-3 font-medium">🦆 DuckDB</th>
                  </tr>
                </thead>
                <tbody>
                  ${tableRows}
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Three-Way Comparison Chart -->
        <div class="rounded-lg border bg-card text-card-foreground shadow-sm mb-8">
          <div class="flex flex-col space-y-1.5 p-6 border-b">
            <div class="flex items-center gap-3">
              <svg class="w-6 h-6 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
              </svg>
              <h2 class="text-2xl font-semibold leading-none tracking-tight">Visual Performance Comparison</h2>
            </div>
          </div>
          <div class="p-6">
            <canvas id="comparisonChart" style="max-height: 400px;"></canvas>
          </div>
        </div>
      `;

      document.getElementById('comparison').innerHTML = comparisonHtml;

      const ctx = document.getElementById('comparisonChart').getContext('2d');
      const labels = sqliteResults.map(r => r.name.replace(/^Query \d+: /, ''));
      const sqliteData = sqliteResults.map(r => r.timeMs);
      const duckdbData = duckdbResults.map(r => r.timeMs);
      const jsonData = jsonResults.map(r => r.timeMs);

      // Calculate averages
      const sqliteAvg = sqliteData.reduce((a, b) => a + b, 0) / sqliteData.length;
      const jsonAvg = jsonData.reduce((a, b) => a + b, 0) / jsonData.length;
      const duckdbAvg = duckdbData.reduce((a, b) => a + b, 0) / duckdbData.length;

      // Find max value for color gradient
      const maxTime = Math.max(...sqliteData, ...duckdbData, ...jsonData);

      comparisonChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'SQLite',
              data: sqliteData,
              backgroundColor: 'hsl(222.2 47.4% 11.2%)',
              borderColor: 'hsl(222.2 47.4% 11.2%)',
              borderWidth: 1,
              borderRadius: 4,
              order: 2
            },
            {
              label: 'SQLite Avg',
              data: Array(labels.length).fill(sqliteAvg),
              type: 'line',
              borderColor: 'hsl(222.2 47.4% 11.2%)',
              borderWidth: 2,
              borderDash: [5, 5],
              pointRadius: 0,
              pointHoverRadius: 0,
              fill: false,
              order: 1,
              xAxisID: 'x-line'
            },
            {
              label: 'In-Memory JSON',
              data: jsonData,
              backgroundColor: 'hsl(215.4 16.3% 46.9%)',
              borderColor: 'hsl(215.4 16.3% 46.9%)',
              borderWidth: 1,
              borderRadius: 4,
              order: 2
            },
            {
              label: 'JSON Avg',
              data: Array(labels.length).fill(jsonAvg),
              type: 'line',
              borderColor: 'hsl(215.4 16.3% 46.9%)',
              borderWidth: 2,
              borderDash: [5, 5],
              pointRadius: 0,
              pointHoverRadius: 0,
              fill: false,
              order: 1,
              xAxisID: 'x-line'
            },
            {
              label: 'DuckDB',
              data: duckdbData,
              backgroundColor: 'hsl(142.1 70% 45%)',
              borderColor: 'hsl(142.1 70% 45%)',
              borderWidth: 1,
              borderRadius: 4,
              order: 2
            },
            {
              label: 'DuckDB Avg',
              data: Array(labels.length).fill(duckdbAvg),
              type: 'line',
              borderColor: 'hsl(142.1 70% 45%)',
              borderWidth: 2,
              borderDash: [5, 5],
              pointRadius: 0,
              pointHoverRadius: 0,
              fill: false,
              order: 1,
              xAxisID: 'x-line'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            legend: {
              display: true,
              position: 'top',
              labels: {
                font: { size: 12 },
                padding: 12,
                boxWidth: 12,
                boxHeight: 12
              }
            },
            tooltip: {
              backgroundColor: 'hsl(222.2 47.4% 11.2%)',
              padding: 12,
              cornerRadius: 6,
              callbacks: {
                label: function (context) {
                  return context.dataset.label + ': ' + formatTime(context.parsed.y);
                }
              }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              grid: {
                color: function (context) {
                  // Create gradient from light gray -> orange -> red based on Y value
                  const value = context.tick.value;
                  const ratio = value / maxTime;

                  if (ratio < 0.33) {
                    // Light gray for low values - 50% transparent
                    const intensity = Math.floor(70 + (ratio / 0.33) * 10);
                    return `hsla(0, 0%, ${intensity}%, 0.25)`;
                  } else if (ratio < 0.66) {
                    // Gray to orange transition - 50% transparent
                    const subRatio = (ratio - 0.33) / 0.33;
                    const hue = Math.floor(subRatio * 35); // 0 to 35 (gray to orange)
                    const saturation = Math.floor(40 + subRatio * 50); // 40% to 90%
                    const lightness = Math.floor(65 - subRatio * 15); // 65% to 50%
                    return `hsla(${hue}, ${saturation}%, ${lightness}%, 0.25)`;
                  } else {
                    // Orange to red for high values - 50% transparent
                    const subRatio = (ratio - 0.66) / 0.34;
                    const hue = Math.floor(35 - subRatio * 35); // 35 to 0 (orange to red)
                    const saturation = Math.floor(90 + subRatio * 5); // 90% to 95%
                    const lightness = Math.floor(50 - subRatio * 15); // 50% to 35%
                    return `hsla(${hue}, ${saturation}%, ${lightness}%, 0.25)`;
                  }
                },
                lineWidth: 1.5,
                drawBorder: false
              },
              ticks: {
                font: { size: 11 },
                color: 'hsl(215.4 16.3% 46.9%)',
                callback: function (value) {
                  return formatTime(value);
                }
              },
              border: { display: false }
            },
            x: {
              offset: true,
              grid: {
                display: false
              },
              ticks: {
                font: { size: 11 },
                color: 'hsl(215.4 16.3% 46.9%)'
              },
              border: { display: false }
            },
            'x-line': {
              type: 'category',
              offset: false,
              display: false,
              labels: labels
            }
          }
        }
      });
    }
  </script>
</body>

</html>
